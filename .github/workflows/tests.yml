name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Show installed versions
        run: |
          python --version
          pip list

      - name: Run pytest
        # Snapshot tests skip cleanly when the input docx files are not on
        # the CI runner — only the local-machine variant exercises them.
        # Unit-level guards (skill_doc_parity, schema_shape_drift,
        # review_override, runner_unit) run on every commit.
        run: pytest tests/ -v --tb=short
