name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Show installed versions
        run: |
          python --version
          pip list

      - name: Run pytest with coverage
        # Snapshot tests skip cleanly when the input docx files are not on
        # the CI runner — only the local-machine variant exercises them.
        # Unit-level guards (skill_doc_parity, schema_shape_drift,
        # review_override, runner_unit) run on every commit. Coverage is
        # measured against the canonical package src/citation_verify/; this
        # is the first run, so the threshold is intentionally loose
        # (--cov-fail-under=0). Phase 2 prep deliverable: tighten as a
        # baseline emerges, target >70% per PLAN once meaningful.
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/citation_verify \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=0
